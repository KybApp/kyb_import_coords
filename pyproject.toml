# Настройки линтера Ruff
[tool.ruff]
line-length = 88
# Исключаем служебные папки из проверки
extend-exclude = ["__pycache__", ".git", "tests"]

[tool.ruff.lint]
# Базовые правила: pycodestyle (E), pyflakes (F), isort (I),
# pyupgrade (UP), bugbear (B) + tidy-imports (TID) для запрета PyQt5.
select = ["E", "F", "I", "UP", "B", "TID"]
# Отключаем встроенные правила безопасности (группа S),
# чтобы их проверял только оригинальный Bandit.
ignore = ["S", "E501", "B007"]

# Запрещаем прямые импорты PyQt5 и PyQt6.
# В QGIS используем qgis.PyQt — это абстракция, которая работает
# и в QGIS 3.x (PyQt5), и в QGIS 4.x (PyQt6).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"PyQt5".msg = "Используйте qgis.PyQt вместо прямого PyQt5 (сломается в QGIS 4)"
"PyQt6".msg = "Используйте qgis.PyQt вместо прямого PyQt6 (сломается в QGIS 3)"

# Настройки безопасности Bandit
[tool.bandit]
# Исключаем служебные папки
exclude_dirs = [".venv", "venv", "__pycache__", ".git", "tests"]
# Уровень серьезности (medium и выше — оптимально для QGIS)
severity-level = "medium"
confidence-level = "medium"