name: Create Release Archive

on:
  push:
    tags:
      - 'v*' # Срабатывает при пуше тега, например, v1.0.0

permissions:
  contents: write # Необходимо для создания релиза

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create ZIP archive via git archive
        run: |
          TAG="${GITHUB_REF_NAME}"                       # например, v1.0.0
          FOLDER_PREFIX="KYB_import_coords"              # папка внутри архива
          ZIP_NAME="kyb_import_coords-${TAG}"            # имя ZIP-файла
          mkdir -p dist
          git archive --format=zip --prefix="${FOLDER_PREFIX}/" HEAD -o "dist/${ZIP_NAME}.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip